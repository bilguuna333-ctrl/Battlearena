openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CodeSteppe API - Mongolian competitive coding platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: problems
  - name: submissions
  - name: battles
  - name: queue
  - name: leaderboard
  - name: seasons
  - name: replays
  - name: missions
  - name: social
  - name: mentor
  - name: hiring
  - name: bosses
  - name: analytics
  - name: i18n
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"

  /users/{username}:
    get:
      operationId: getUserProfile
      tags: [users]
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /users/{username}/history:
    get:
      operationId: getUserBattleHistory
      tags: [users]
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BattleHistoryItem"
  /users/{username}/elo-history:
    get:
      operationId: getUserEloHistory
      tags: [users]
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EloHistoryItem"

  /problems:
    get:
      operationId: listProblems
      tags: [problems]
      parameters:
        - name: difficulty
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProblemSummary"
  /problems/{slug}:
    get:
      operationId: getProblem
      tags: [problems]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /submissions:
    post:
      operationId: createSubmission
      tags: [submissions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
  /submissions/recent:
    get:
      operationId: getRecentSubmissions
      tags: [submissions]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubmissionSummary"

  /queue/join:
    post:
      operationId: joinQueue
      tags: [queue]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinQueueInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStatus"
  /queue/cancel:
    post:
      operationId: cancelQueue
      tags: [queue]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /queue/status:
    get:
      operationId: getQueueStatus
      tags: [queue]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStatus"
  /queue/accept:
    post:
      operationId: acceptMatch
      tags: [queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptMatchInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStatus"

  /battles/{id}:
    get:
      operationId: getBattle
      tags: [battles]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Battle"
  /battles/{id}/submit:
    post:
      operationId: submitBattleSolution
      tags: [battles]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleSubmissionResult"
  /battles/{id}/chat:
    post:
      operationId: sendBattleChat
      tags: [battles]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [global, weekly, monthly, season]
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [elo, xp]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /seasons/current:
    get:
      operationId: getCurrentSeason
      tags: [seasons]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"
  /seasons:
    get:
      operationId: listSeasons
      tags: [seasons]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Season"

  /me/language:
    post:
      operationId: setLanguage
      tags: [i18n]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetLanguageInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /replays/{battleId}:
    get:
      operationId: getReplay
      tags: [replays]
      parameters:
        - name: battleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Replay"

  /missions:
    get:
      operationId: getMyMissions
      tags: [missions]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MissionProgress"
  /missions/{id}/claim:
    post:
      operationId: claimMission
      tags: [missions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionClaimResult"

  /social/feed:
    get:
      operationId: getActivityFeed
      tags: [social]
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [global, following]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /social/follow:
    post:
      operationId: followUser
      tags: [social]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserTargetInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /social/unfollow:
    post:
      operationId: unfollowUser
      tags: [social]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserTargetInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /social/friends:
    get:
      operationId: getFriends
      tags: [social]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendsResponse"
  /social/friends/request:
    post:
      operationId: sendFriendRequest
      tags: [social]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserTargetInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /social/friends/accept:
    post:
      operationId: acceptFriendRequest
      tags: [social]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserTargetInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /social/messages/{username}:
    get:
      operationId: getConversation
      tags: [social]
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DirectMessage"
  /social/messages/send:
    post:
      operationId: sendMessage
      tags: [social]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectMessage"
  /social/notifications:
    get:
      operationId: getNotifications
      tags: [social]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationItem"
  /social/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [social]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /mentor/groups:
    get:
      operationId: listMyMentorGroups
      tags: [mentor]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MentorGroupSummary"
    post:
      operationId: createMentorGroup
      tags: [mentor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMentorGroupInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorGroupDetail"
  /mentor/groups/{id}:
    get:
      operationId: getMentorGroup
      tags: [mentor]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorGroupDetail"
  /mentor/groups/join:
    post:
      operationId: joinMentorGroup
      tags: [mentor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGroupInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorGroupDetail"
  /mentor/groups/{id}/assignments:
    post:
      operationId: createAssignment
      tags: [mentor]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentSummary"
  /mentor/assignments/{id}/submit:
    post:
      operationId: submitAssignment
      tags: [mentor]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAssignmentInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /mentor/assignments/{id}/review:
    post:
      operationId: reviewAssignment
      tags: [mentor]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewAssignmentInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /hiring/challenges:
    get:
      operationId: listHiringChallenges
      tags: [hiring]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HiringChallengeSummary"
  /hiring/challenges/{id}:
    get:
      operationId: getHiringChallenge
      tags: [hiring]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HiringChallengeDetail"
  /hiring/challenges/{id}/apply:
    post:
      operationId: applyToHiringChallenge
      tags: [hiring]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /hiring/challenges/{id}/leaderboard:
    get:
      operationId: getHiringLeaderboard
      tags: [hiring]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CandidateEntry"

  /bosses:
    get:
      operationId: listBosses
      tags: [bosses]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BossSummary"
  /bosses/{slug}:
    get:
      operationId: getBoss
      tags: [bosses]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BossDetail"
  /bosses/{slug}/start:
    post:
      operationId: startBossFight
      tags: [bosses]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BossFightState"
  /boss-fights/active:
    get:
      operationId: getActiveBossFight
      tags: [bosses]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BossFightState"
  /boss-fights/{id}/attack:
    post:
      operationId: bossAttack
      tags: [bosses]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BossAttackInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BossAttackResult"
  /boss-fights/{id}/forfeit:
    post:
      operationId: forfeitBossFight
      tags: [bosses]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /analytics/me:
    get:
      operationId: getMyAnalytics
      tags: [analytics]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAnalytics"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    RegisterInput:
      type: object
      required: [username, displayName, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 24 }
        displayName: { type: string, minLength: 1, maxLength: 60 }
        password: { type: string, minLength: 4 }
        favoriteLanguage:
          type: ["string", "null"]
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/CurrentUser" }
    CurrentUser:
      type: object
      required:
        [
          id,
          username,
          displayName,
          eloRating,
          highestElo,
          xp,
          coins,
          language,
          battleWins,
          battleLosses,
          battleDraws,
          winStreak,
          rank,
          highestRank,
          favoriteLanguage,
          createdAt,
        ]
      properties:
        id: { type: integer }
        username: { type: string }
        displayName: { type: string }
        avatarSeed: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        bio: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        eloRating: { type: integer }
        highestElo: { type: integer }
        xp: { type: integer }
        coins: { type: integer }
        language: { type: string }
        title: { type: ["string", "null"] }
        battleWins: { type: integer }
        battleLosses: { type: integer }
        battleDraws: { type: integer }
        winStreak: { type: integer }
        rank: { type: string }
        highestRank: { type: string }
        favoriteLanguage: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    UserProfile:
      type: object
      required:
        [
          id,
          username,
          displayName,
          eloRating,
          highestElo,
          xp,
          battleWins,
          battleLosses,
          battleDraws,
          winStreak,
          rank,
          highestRank,
          favoriteLanguage,
          createdAt,
          winRate,
          totalBattles,
          recentMatches,
          eloHistory,
          badges,
        ]
      properties:
        id: { type: integer }
        username: { type: string }
        displayName: { type: string }
        avatarSeed: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        bio: { type: ["string", "null"] }
        eloRating: { type: integer }
        highestElo: { type: integer }
        xp: { type: integer }
        battleWins: { type: integer }
        battleLosses: { type: integer }
        battleDraws: { type: integer }
        winStreak: { type: integer }
        rank: { type: string }
        highestRank: { type: string }
        favoriteLanguage: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        winRate: { type: number }
        totalBattles: { type: integer }
        recentMatches:
          type: array
          items: { $ref: "#/components/schemas/BattleHistoryItem" }
        eloHistory:
          type: array
          items: { $ref: "#/components/schemas/EloHistoryItem" }
        badges:
          type: array
          items: { $ref: "#/components/schemas/Badge" }

    Badge:
      type: object
      required: [id, name, description, icon]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        icon: { type: string }

    BattleHistoryItem:
      type: object
      required: [battleId, opponentUsername, opponentDisplayName, opponentElo, result, eloChange, eloAfter, problemTitle, finishedAt]
      properties:
        battleId: { type: string }
        opponentUsername: { type: string }
        opponentDisplayName: { type: string }
        opponentElo: { type: integer }
        result:
          type: string
          enum: [win, loss, draw]
        eloChange: { type: integer }
        eloAfter: { type: integer }
        problemTitle: { type: string }
        finishedAt: { type: string, format: date-time }

    EloHistoryItem:
      type: object
      required: [elo, change, reason, createdAt]
      properties:
        elo: { type: integer }
        change: { type: integer }
        reason: { type: string }
        createdAt: { type: string, format: date-time }

    ProblemSummary:
      type: object
