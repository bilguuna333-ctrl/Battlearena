openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CodeSteppe API - Mongolian competitive coding platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: problems
  - name: submissions
  - name: battles
  - name: queue
  - name: leaderboard
  - name: seasons
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"

  /users/{username}:
    get:
      operationId: getUserProfile
      tags: [users]
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /users/{username}/history:
    get:
      operationId: getUserBattleHistory
      tags: [users]
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BattleHistoryItem"
  /users/{username}/elo-history:
    get:
      operationId: getUserEloHistory
      tags: [users]
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EloHistoryItem"

  /problems:
    get:
      operationId: listProblems
      tags: [problems]
      parameters:
        - name: difficulty
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProblemSummary"
  /problems/{slug}:
    get:
      operationId: getProblem
      tags: [problems]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /submissions:
    post:
      operationId: createSubmission
      tags: [submissions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
  /submissions/recent:
    get:
      operationId: getRecentSubmissions
      tags: [submissions]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubmissionSummary"

  /queue/join:
    post:
      operationId: joinQueue
      tags: [queue]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStatus"
  /queue/cancel:
    post:
      operationId: cancelQueue
      tags: [queue]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /queue/status:
    get:
      operationId: getQueueStatus
      tags: [queue]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStatus"
  /queue/accept:
    post:
      operationId: acceptMatch
      tags: [queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptMatchInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStatus"

  /battles/{id}:
    get:
      operationId: getBattle
      tags: [battles]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Battle"
  /battles/{id}/submit:
    post:
      operationId: submitBattleSolution
      tags: [battles]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleSubmissionResult"
  /battles/{id}/chat:
    post:
      operationId: sendBattleChat
      tags: [battles]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [global, weekly, monthly, season]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /seasons/current:
    get:
      operationId: getCurrentSeason
      tags: [seasons]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"
  /seasons:
    get:
      operationId: listSeasons
      tags: [seasons]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Season"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    RegisterInput:
      type: object
      required: [username, displayName, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 24 }
        displayName: { type: string, minLength: 1, maxLength: 60 }
        password: { type: string, minLength: 4 }
        favoriteLanguage:
          type: ["string", "null"]
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/CurrentUser" }
    CurrentUser:
      type: object
      required:
        [
          id,
          username,
          displayName,
          eloRating,
          highestElo,
          xp,
          battleWins,
          battleLosses,
          battleDraws,
          winStreak,
          rank,
          highestRank,
          favoriteLanguage,
          createdAt,
        ]
      properties:
        id: { type: integer }
        username: { type: string }
        displayName: { type: string }
        avatarSeed: { type: ["string", "null"] }
        bio: { type: ["string", "null"] }
        eloRating: { type: integer }
        highestElo: { type: integer }
        xp: { type: integer }
        battleWins: { type: integer }
        battleLosses: { type: integer }
        battleDraws: { type: integer }
        winStreak: { type: integer }
        rank: { type: string }
        highestRank: { type: string }
        favoriteLanguage: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    UserProfile:
      type: object
      required:
        [
          id,
          username,
          displayName,
          eloRating,
          highestElo,
          xp,
          battleWins,
          battleLosses,
          battleDraws,
          winStreak,
          rank,
          highestRank,
          favoriteLanguage,
          createdAt,
          winRate,
          totalBattles,
          recentMatches,
          eloHistory,
          badges,
        ]
      properties:
        id: { type: integer }
        username: { type: string }
        displayName: { type: string }
        avatarSeed: { type: ["string", "null"] }
        bio: { type: ["string", "null"] }
        eloRating: { type: integer }
        highestElo: { type: integer }
        xp: { type: integer }
        battleWins: { type: integer }
        battleLosses: { type: integer }
        battleDraws: { type: integer }
        winStreak: { type: integer }
        rank: { type: string }
        highestRank: { type: string }
        favoriteLanguage: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        winRate: { type: number }
        totalBattles: { type: integer }
        recentMatches:
          type: array
          items: { $ref: "#/components/schemas/BattleHistoryItem" }
        eloHistory:
          type: array
          items: { $ref: "#/components/schemas/EloHistoryItem" }
        badges:
          type: array
          items: { $ref: "#/components/schemas/Badge" }

    Badge:
      type: object
      required: [id, name, description, icon]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        icon: { type: string }

    BattleHistoryItem:
      type: object
      required: [battleId, opponentUsername, opponentDisplayName, opponentElo, result, eloChange, eloAfter, problemTitle, finishedAt]
      properties:
        battleId: { type: string }
        opponentUsername: { type: string }
        opponentDisplayName: { type: string }
        opponentElo: { type: integer }
        result:
          type: string
          enum: [win, loss, draw]
        eloChange: { type: integer }
        eloAfter: { type: integer }
        problemTitle: { type: string }
        finishedAt: { type: string, format: date-time }

    EloHistoryItem:
      type: object
      required: [elo, change, reason, createdAt]
      properties:
        elo: { type: integer }
        change: { type: integer }
        reason: { type: string }
        createdAt: { type: string, format: date-time }

    ProblemSummary:
      type: object
      required: [id, slug, title, difficulty, tags, xpReward, eloReward, solvedCount]
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        difficulty: { type: string }
        tags:
          type: array
          items: { type: string }
        xpReward: { type: integer }
        eloReward: { type: integer }
        solvedCount: { type: integer }

    Problem:
      type: object
      required:
        [
          id,
          slug,
          title,
          difficulty,
          statement,
          inputDescription,
          outputDescription,
          constraints,
          examples,
          publicTestCases,
          tags,
          xpReward,
          eloReward,
          timeLimit,
          memoryLimit,
          starterCode,
        ]
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        difficulty: { type: string }
        statement: { type: string }
        inputDescription: { type: string }
        outputDescription: { type: string }
        constraints: { type: string }
        examples:
          type: array
          items:
            type: object
            required: [input, output]
            properties:
              input: { type: string }
              output: { type: string }
              explanation: { type: ["string", "null"] }
        publicTestCases:
          type: array
          items:
            type: object
            required: [input, expectedOutput]
            properties:
              input: { type: string }
              expectedOutput: { type: string }
        tags:
          type: array
          items: { type: string }
        xpReward: { type: integer }
        eloReward: { type: integer }
        timeLimit: { type: integer }
        memoryLimit: { type: integer }
        starterCode:
          type: object
          required: [javascript, python]
          properties:
            javascript: { type: string }
            python: { type: string }

    SubmissionInput:
      type: object
      required: [problemSlug, language, code]
      properties:
        problemSlug: { type: string }
        language:
          type: string
          enum: [javascript, python]
        code: { type: string }

    SubmissionResult:
      type: object
      required: [id, status, passedCount, totalCount, runtimeMs, results, xpGained, message]
      properties:
        id: { type: integer }
        status: { type: string }
        passedCount: { type: integer }
        totalCount: { type: integer }
        runtimeMs: { type: integer }
        xpGained: { type: integer }
        message: { type: string }
        results:
          type: array
          items:
            type: object
            required: [passed, expected, actual]
            properties:
              passed: { type: boolean }
              input: { type: string }
              expected: { type: string }
              actual: { type: string }

    BattleSubmissionResult:
      type: object
      required: [submissionId, status, passedCount, totalCount, runtimeMs, message, battleFinished]
      properties:
        submissionId: { type: integer }
        status: { type: string }
        passedCount: { type: integer }
        totalCount: { type: integer }
        runtimeMs: { type: integer }
        message: { type: string }
        battleFinished: { type: boolean }

    SubmissionSummary:
      type: object
      required: [id, problemTitle, problemSlug, status, language, createdAt]
      properties:
        id: { type: integer }
        problemTitle: { type: string }
        problemSlug: { type: string }
        status: { type: string }
        language: { type: string }
        createdAt: { type: string, format: date-time }

    QueueStatus:
      type: object
      required: [state, secondsInQueue, searchRange]
      properties:
        state:
          type: string
          enum: [idle, searching, match_found, accepted, in_battle, finished]
        secondsInQueue: { type: integer }
        searchRange: { type: integer }
        matchId:
          type: ["string", "null"]
        battleId:
          type: ["string", "null"]
        opponent:
          oneOf:
            - $ref: "#/components/schemas/OpponentSummary"
            - type: "null"
        acceptDeadline:
          type: ["string", "null"]
          format: date-time

    OpponentSummary:
      type: object
      required: [username, displayName, eloRating, rank, winRate, battleWins]
      properties:
        username: { type: string }
        displayName: { type: string }
        avatarSeed: { type: ["string", "null"] }
        eloRating: { type: integer }
        rank: { type: string }
        winRate: { type: number }
        battleWins: { type: integer }

    AcceptMatchInput:
      type: object
      required: [matchId, accept]
      properties:
        matchId: { type: string }
        accept: { type: boolean }

    Battle:
      type: object
      required: [id, state, startedAt, durationSeconds, problem, you, opponent, chat]
      properties:
        id: { type: string }
        state:
          type: string
          enum: [in_battle, finished]
        startedAt: { type: string, format: date-time }
        finishedAt:
          type: ["string", "null"]
          format: date-time
        durationSeconds: { type: integer }
        problem: { $ref: "#/components/schemas/Problem" }
        you: { $ref: "#/components/schemas/BattleParticipant" }
        opponent: { $ref: "#/components/schemas/BattleParticipant" }
        winnerUsername:
          type: ["string", "null"]
        result:
          type: ["string", "null"]
          enum: [win, loss, draw, null]
        eloChange:
          type: ["integer", "null"]
        chat:
          type: array
          items: { $ref: "#/components/schemas/BattleChatMessage" }

    BattleParticipant:
      type: object
      required: [username, displayName, eloRating, rank, passedTests, totalTests, status, submissionsCount]
      properties:
        username: { type: string }
        displayName: { type: string }
        avatarSeed: { type: ["string", "null"] }
        eloRating: { type: integer }
        rank: { type: string }
        passedTests: { type: integer }
        totalTests: { type: integer }
        status: { type: string }
        submissionsCount: { type: integer }
        finishedAt:
          type: ["string", "null"]
          format: date-time

    BattleChatMessage:
      type: object
      required: [id, username, displayName, message, createdAt]
      properties:
        id: { type: integer }
        username: { type: string }
        displayName: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }

    SendChatInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 200 }

    LeaderboardEntry:
      type: object
      required: [position, username, displayName, eloRating, rank, battleWins, battleLosses, winRate, winStreak]
      properties:
        position: { type: integer }
        username: { type: string }
        displayName: { type: string }
        avatarSeed: { type: ["string", "null"] }
        eloRating: { type: integer }
        rank: { type: string }
        battleWins: { type: integer }
        battleLosses: { type: integer }
        winRate: { type: number }
        winStreak: { type: integer }

    Season:
      type: object
      required: [id, name, startedAt, endsAt, isActive]
      properties:
        id: { type: integer }
        name: { type: string }
        startedAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        isActive: { type: boolean }
        topPlayer:
          oneOf:
            - $ref: "#/components/schemas/LeaderboardEntry"
            - type: "null"
